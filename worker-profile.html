<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORKSURE - My Profile</title>
    <link rel="stylesheet" href="worker-profile.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">✱</span>
                <span class="logo-text">WORKSURE</span>
            </div>
            <nav class="nav">
                <a href="worker-dashboard.html" class="nav-link">Dashboard</a>
                <a href="#" class="nav-link active">My Profile</a>
                <a href="#" class="nav-link">Requests</a>
                <a href="#" class="nav-link">Chat</a>
            </nav>
            <div class="header-right">
                <div class="location">
                    <span class="location-icon">📍</span>
                    <span class="location-text">Nagpur, Maharashtra, IN</span>
                </div>
                <button class="btn-notification">
                    🔔
                    <span class="notification-badge">2</span>
                </button>
                <div class="user-menu">
                    <div class="user-avatar" id="userAvatar">W</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="profile-container">
                <!-- Profile Header -->
                <div class="profile-header">
                    <h1 class="profile-title">My Profile</h1>
                    <p class="profile-subtitle">Complete your profile to get more job opportunities</p>
                </div>

                <!-- Success/Error Messages -->
                <div class="message success-message" id="successMessage"></div>
                <div class="message error-message" id="errorMessage"></div>

                <!-- Profile Form -->
                <form id="profileForm" class="profile-form">
                    <!-- Profile Picture -->
                    <div class="form-section">
                        <h2 class="section-heading">Profile Picture</h2>
                        <div class="profile-picture-section">
                            <div class="profile-pic-preview" id="profilePicPreview">
                                <span id="profileInitial">W</span>
                            </div>
                            <div class="profile-pic-upload">
                                <label for="profilePicture" class="btn-upload">Upload Image</label>
                                <input type="file" id="profilePicture" accept="image/*" style="display: none;">
                                <p class="upload-hint">PNG, JPG up to 5MB</p>
                            </div>
                        </div>
                    </div>

                    <!-- Personal Information -->
                    <div class="form-section">
                        <h2 class="section-heading">Personal Information</h2>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="fullName">Full Name *</label>
                                <input type="text" id="fullName" placeholder="John Doe" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email *</label>
                                <input type="email" id="email" placeholder="john@example.com" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone Number *</label>
                                <input type="tel" id="phone" placeholder="+91 98765 43210" required>
                            </div>
                            <div class="form-group">
                                <label for="age">Age *</label>
                                <input type="number" id="age" placeholder="30" min="18" max="100" required>
                            </div>
                            <div class="form-group full-width">
                                <label for="gender">Gender *</label>
                                <select id="gender" required>
                                    <option value="">Select Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Professional Information -->
                    <div class="form-section">
                        <h2 class="section-heading">Professional Information</h2>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="profession">Profession *</label>
                                <select id="profession" required>
                                    <option value="">Select Profession</option>
                                    <option value="Electrician">Electrician</option>
                                    <option value="Plumber">Plumber</option>
                                    <option value="Carpenter">Carpenter</option>
                                    <option value="Painter">Painter</option>
                                    <option value="HVAC Technician">HVAC Technician</option>
                                    <option value="Mason">Mason</option>
                                    <option value="Welder">Welder</option>
                                    <option value="Cleaner">Cleaner</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="experienceYears">Years of Experience *</label>
                                <input type="number" id="experienceYears" placeholder="5" min="0" max="50" required>
                            </div>
                            <div class="form-group">
                                <label for="hourlyRate">Hourly Rate (₹) *</label>
                                <input type="number" id="hourlyRate" placeholder="500" min="0" step="50" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="bio">About Me *</label>
                            <textarea id="bio" rows="4" placeholder="Tell us about your experience and expertise..." required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="skills">Skills (comma separated) *</label>
                            <input type="text" id="skills" placeholder="e.g., Electrical Wiring, Troubleshooting, Installation" required>
                        </div>
                    </div>

                    <!-- Location Information -->
                    <div class="form-section">
                        <h2 class="section-heading">Location</h2>
                        <div class="form-grid">
                            <div class="form-group full-width">
                                <label for="address">Address *</label>
                                <textarea id="address" rows="2" placeholder="Street address" required></textarea>
                            </div>
                            <div class="form-group">
                                <label for="city">City *</label>
                                <input type="text" id="city" placeholder="Nagpur" required>
                            </div>
                            <div class="form-group">
                                <label for="state">State *</label>
                                <input type="text" id="state" placeholder="Maharashtra" required>
                            </div>
                            <div class="form-group">
                                <label for="zipCode">ZIP Code</label>
                                <input type="text" id="zipCode" placeholder="440001">
                            </div>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" onclick="window.location.href='worker-dashboard.html'">Cancel</button>
                        <button type="submit" class="btn-primary">Save Profile</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="worker-profile.js"></script>
</body>
</html>
