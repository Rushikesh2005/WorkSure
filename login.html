<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORKSURE - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <span class="logo-icon">✱</span>
            <div class="logo-text">WORKSURE</div>
            <p class="tagline">Skilled Workers at Your Service</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="john.doe@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Log In</button>
        </form>

        <div class="signup-link">
            New here? <a href="#" id="createAccountLink">Create an account.</a>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
